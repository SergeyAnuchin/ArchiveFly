<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ZIP Form - форма создания архива</title>
    <link href="jquery-ui.min.css" rel="stylesheet">
    <style>
        body {
            font-family: "Trebuchet MS", sans-serif;
            margin: 50px;
        }

        .archiveHeaders {
            margin-top: 2em;
        }

        .archiveTextarea {
            min-width: 5in;
            min-height: 2in;
        }

        .modal {
            padding: 50px;
            position: fixed;
            top: 50%;
            left: 50%;
            -webkit-transform: translate(-50%, -50%);
            -ms-transform: translate(-50%, -50%);
            transform: translate(-50%, -50%);
        }

        form {
            min-width: 5in;
            min-height: 2in;
        }

        .button {
            padding: 0.5rem 0.75rem;
            border: none;
            border-radius: 4px;
            background: #3b82f6;
            color: #fff;
            cursor: pointer;
            font-family: inherit;
        }

        .toast {
            position: fixed;
            bottom: 5rem;
            right: 5rem;
            background: #3b82f6;
            color: #fff;
            padding: .75rem 1rem;
            border-radius: 4px;
            opacity: .9;
            z-index: 1000;
        }
    </style>

</head>

<body>
    <div class="modal">
        <div>
            <h2>ZIP Form</h2>
            <div class="ui-widget">
                <p>Форма для создания архива</p>
            </div>
        </div>

        <div id="formCreate">
            <h2 class="archiveHeaders">Введите данные</h2>
            <form>
                <div>
                    <textarea class="archiveTextarea" id="textArchive" rows="3"
                        placeholder="Вставьтте сюда текст, который вы хотите передать в зашифрованном архиве."></textarea>
                </div>


            </form>
            <button id="btnCreate" type="button" class="button">Создать архив</button>
        </div>

        <div id="formResult" style="display: none;">
            <h2 class="archiveHeaders">Пароль</h2>
            <form>
                <div style="top:1rem; right:1rem; display:flex; align-items:center; gap:0.5rem; z-index:auto;">
                    <input id="viewPass" type="text"
                        style="padding:0.5rem 0.75rem; border:1px solid #ddd; border-radius:4px; font-size:1rem; font-family:inherit; background:#fafafa;"
                        readonly />
                    <button id="copyPass" type="button" title="Copy password" class="button">Скопировать в буфер обмена</button>
                </div>


            </form>
            <button id="btnRefresh" type="button" class="button">Назад</button>
        </div>
    </div>


    <script src="jquery.min.js"></script>
    <script src="jquery-ui.min.js"></script>
    <script type="text/javascript" src="zip.min.js"></script>
    <script>
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000); // hide after 3 s
        }
        document.getElementById('copyPass').addEventListener('click', () => {
            const pwd = document.getElementById('viewPass').value;
            navigator.clipboard.writeText(pwd).then(() => {
                showToast('Пароль скопирован в буфер обмена!');
            });
        });
    </script>
    <script>
        async function getZipFileBlob(genPass) {
            zip.configure({
                chunkSize: 128,
                useWebWorkers: true
            });
            const zipWriter = new zip.ZipWriter(new zip.BlobWriter("application/zip"));
            await Promise.all([
                zipWriter.add("hello.txt", new zip.TextReader(jQuery("#textArchive").val()), {
                    password: genPass,
                    zipCrypto: true
                })
            ]);
            return zipWriter.close();
        }

        function downloadFile(blob) {
            const link = document.createElement("a")
            link.href = URL.createObjectURL(blob)
            link.download = "archive.zip"
            link.click()
            link.remove()
        }

        function callbackResult() {
            jQuery("#formResult").show();
        };

        function callbackCreate() {
            jQuery("#formCreate").show();
        };

        jQuery("#btnCreate, #btnRefresh").button();

        jQuery("#btnRefresh").on("click", function () {
            jQuery("#formResult").hide("fade", "", 500, callbackCreate);
        });



        jQuery("#btnCreate").on("click", function () {

            function randomPassword(length = 10) {
                const CHARS = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$_+?%^&)";

                const CHARS_LEN = CHARS.length;
                const BITS_PER_BYTE = 6;
                const MASK = (1 << BITS_PER_BYTE) - 1;

                const result = [];
                const randomBytes = new Uint8Array(length * 2);

                let generated = 0;
                while (generated < length) {
                    crypto.getRandomValues(randomBytes);

                    for (let i = 0; i < randomBytes.length && generated < length; i++) {
                        const index = randomBytes[i] & MASK; // 0‑63

                        if (index < CHARS_LEN) {
                            result.push(CHARS[index]);
                            generated++;
                        }
                    }
                }

                return result.join("");
            }

            var genPass = randomPassword();

            getZipFileBlob(genPass)
                .then(downloadFile);
            jQuery("#viewPass").val(genPass);
            $("#dialog").dialog("open");
            jQuery("#textArchive").val("");
            jQuery("#formCreate").fadeOut(500, callbackResult);
        });
    </script>

</body>

</html>
